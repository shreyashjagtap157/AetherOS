name: RISC-V64 Boot Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: riscv64-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-riscv64-boot:
    name: RV64 QEMU virt boot qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
        working-directory: reference/crates/aether-arch-riscv64
      - name: Install QEMU RISC-V64 emulator
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-misc
          qemu-system-riscv64 --version | head -n 1
      - name: Build RV64 boot checkpoint payload
        run: cargo build --release --target riscv64gc-unknown-none-elf
        working-directory: reference/crates/aether-arch-riscv64
      - name: Verify ELF format and header
        run: |
          ARTIFACT=target/riscv64gc-unknown-none-elf/release/aether-arch-riscv64
          test -s "$ARTIFACT" || { echo "missing or empty ELF"; exit 1; }
          magic=$(head -c 4 "$ARTIFACT")
          test "$magic" = $'\x7fELF' || { echo "not an ELF: $magic"; exit 1; }
          machine=$(od -An -tu2 -j18 -N2 "$ARTIFACT" | tr -d ' ')
          test "$machine" = "243" || { echo "not RISC-V (machine=$machine)"; exit 1; }
          type=$(od -An -tu2 -j16 -N2 "$ARTIFACT" | tr -d ' ')
          test "$type" = "2" || { echo "not ET_EXEC (type=$type)"; exit 1; }
          entry=$(od -An -tx1 -j24 -N8 "$ARTIFACT" | tr -d ' ')
          entry="0x$(echo "$entry" | tr 'a-f' 'A-F')"
          test "$entry" = "0x80200000" || { echo "bad entry $entry"; exit 1; }
          echo "ELF OK: entry=$entry machine=$machine type=$type"
        working-directory: reference/crates/aether-arch-riscv64
      - name: Boot QEMU virt RISC-V64 with OpenSBI payload
        id: boot
        timeout-minutes: 10
        run: |
          ARTIFACT=target/riscv64gc-unknown-none-elf/release/aether-arch-riscv64
          timeout 60 qemu-system-riscv64 \
            -machine virt \
            -m 128M \
            -bios default \
            -kernel "$ARTIFACT" \
            -nographic \
            -serial stdio \
            -monitor none \
            > boot.log 2>&1 || true
          echo "exit=$?" >> boot.status
          cp boot.log boot.log.txt
        working-directory: reference/crates/aether-arch-riscv64
      - name: Validate boot result
        run: |
          ARTIFACT=target/riscv64gc-unknown-none-elf/release/aether-arch-riscv64
          if ! test -s "$ARTIFACT"; then echo "ARTIFACT missing"; exit 1; fi
          if ! head -c 4 "$ARTIFACT" | grep -q $'\x7fELF'; then echo "not ELF"; exit 1; fi
          if ! od -An -tu2 -j18 -N2 "$ARTIFACT" | tr -d ' ' | grep -q 243; then echo "not RISC-V"; exit 1; fi
          if ! od -An -tu2 -j16 -N2 "$ARTIFACT" | tr -d ' ' | grep -q 2; then echo "not ET_EXEC"; exit 1; fi
          if ! od -An -tx1 -j24 -N8 "$ARTIFACT" | tr -d ' ' | tr 'a-f' 'A-F' | grep -q 80200000; then echo "bad entry"; exit 1; fi
          if [ ! -s boot.log ]; then echo "no console output"; exit 1; fi
          if ! grep -q "AetherOS RV64 boot checkpoint" boot.log; then echo "marker missing"; cat boot.log; exit 1; fi
          exit_code=$(cut -d= -f2 boot.status)
          if [ "$exit_code" != "0" ]; then echo "emulator exited $exit_code"; exit 1; fi
          echo "boot ok"
        working-directory: reference/crates/aether-arch-riscv64
      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riscv64-boot-evidence-${{ github.sha }}
          path: |
            target/riscv64gc-unknown-none-elf/release/aether-arch-riscv64
            boot.log
            boot.log.txt
            boot.status
          retention-days: 30
        working-directory: reference/crates/aether-arch-riscv64
