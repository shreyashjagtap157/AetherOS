name: Reference validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reference-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Documentation and host reference
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Validate repository
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/evidence
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "event=$GITHUB_EVENT_NAME"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee artifacts/evidence/run-context.txt
          ./check.sh 2>&1 | tee artifacts/evidence/check.log
      - name: Retain reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-evidence-${{ github.sha }}
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 30
