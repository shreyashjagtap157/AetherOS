## Evidence Requirements

Per `RFC-GOV-002` / `ARCHITECTURE-GOVERNANCE.md`, amendments require one of:
- [ ] **Conformance evidence**: Failing CTS test that the amendment enables to pass
- [ ] **Verification evidence**: Formal proof/model-checking artifact
- [ ] **Security evidence**: Independent review, red-team result, or vulnerability fix

## Implementation Impact

- [ ] Requires reference implementation changes (`reference/`)
- [ ] Requires CTS test additions (`reference/crates/aether-cts-runner/`)
- [ ] Requires formal model updates
- [ ] Requires documentation updates
- [ ] No implementation impact (purely editorial/clarification)

## Migration / Compatibility

- **Forward compatible**: Yes / No (explain)
- **Breaking change**: Yes / No
- **Profile impact**: Which profiles affected?

