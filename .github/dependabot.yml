version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/reference"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "build-engineering"
    assignees:
      - "build-engineering"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Pin rust-toolchain.toml version manually
      - dependency-name: "rust"
    automerge: false