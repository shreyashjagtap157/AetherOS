[workspace]
members = [
    "crates/aether-types",
    "crates/aether-cap-model",
    "crates/aether-capspace",
    "crates/aether-state-model",
    "crates/aether-cts-runner",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
