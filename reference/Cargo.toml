[workspace]
exclude = ["crates/aether-arch-riscv64"]
members = [
    "crates/aether-types",
    "crates/aether-cap-model",
    "crates/aether-capspace",
    "crates/aether-state-model",
    "crates/aether-cts-runner",
    "crates/aether-sched-model",
    "crates/aether-dispatch-model",
    "crates/aether-exec-domain-model",
    "crates/aether-event-model",
    "crates/aether-address-space-model",
    "crates/aether-interrupt-model",
    "crates/aether-mediation-model",
    "crates/aether-object-identity",
    "crates/aether-integrity-model",
    "crates/aether-lifecycle-model",
    "crates/aether-storage-model",
    "crates/aether-trace-model",
    "crates/aether-replay-model",
    "crates/aether-runtime-model",
    "crates/aether-shell-model",
    "crates/aether-time-model",
    "crates/aether-update-model",
    "crates/aether-comp-model",
    "crates/aether-virtio-net-test",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
